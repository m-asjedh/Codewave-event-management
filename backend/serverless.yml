service: codewave-backend

frameworkVersion: "3"

configValidationMode: error

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: 'ap-southeast-1'
  memorySize: 256
  timeout: 28
  httpApi:
    cors:
      allowedOrigins:
        - ${env:CORS_ORIGIN, '*'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
  environment:
    STAGE: ${self:provider.stage}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
    MONGODB_URI: ${env:MONGODB_URI, ''}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL, ''}
    SQS_QUEUE_ARN: ${env:SQS_QUEUE_ARN, ''}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME, ''}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
    SES_EMAIL_FROM: ${env:SES_EMAIL_FROM, ''}
    SECRET_MANAGER_ARN: ${env:SECRET_MANAGER_ARN, ''}

functions:
  health:
    handler: src/handlers/health.handler
    description: Liveness probe for API + deployment smoke test
    events:
      - httpApi:
          path: /health
          method: get

# Add `provider.iam.role.statements` (SQS, S3, SES, Secrets Manager) when Lambdas call those services.
