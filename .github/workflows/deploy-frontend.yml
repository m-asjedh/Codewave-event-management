name: Deploy frontend (S3 + CloudFront)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy-frontend:
    name: build and sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build (static export)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        env:
          BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
        run: |
          if [ -z "$BUCKET" ]; then
            echo "::error::Set GitHub secret FRONTEND_S3_BUCKET to your static site bucket name."
            exit 1
          fi
          aws s3 sync out/ "s3://${BUCKET}/" --delete

      - name: Invalidate CloudFront (optional)
        env:
          DIST_ID: ${{ secrets.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DIST_ID" ]; then
            echo "Skipping CloudFront invalidation (secret FRONTEND_CLOUDFRONT_DISTRIBUTION_ID not set)."
            exit 0
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
